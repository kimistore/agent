<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="100%" stop-color="#0b0f1e"/>
    </linearGradient>
    <linearGradient id="lgsheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".26"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ea8ff"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity=".32"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- mark: the same geometry as logo.svg, scaled into the card -->
  <g transform="translate(88,92) scale(2.2)">
    <rect x="1" y="1" width="62" height="62" rx="16" fill="url(#lg)"/>
    <rect x="1" y="1" width="62" height="62" rx="16" fill="url(#lgsheen)"/>
    <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
       transform="translate(32 32) scale(1.16) translate(-32 -32)">
      <path d="M16 19V45"/>
      <path d="M16 32 28 19"/>
      <path d="M16 32 28 45"/>
      <path d="M48 25.2C48 21.8 44.6 19 41 19S34 21.8 34 25.2s3.4 5.8 7 6.8 7 3.4 7 6.8-3.4 6.2-7 6.2-7-2.8-7-6.2"/>
    </g>
  </g>

  <text x="88" y="330" font-family="Inter, -apple-system, Segoe UI, system-ui, sans-serif"
        font-size="88" font-weight="800" letter-spacing="-4" fill="#e9edf7">Kimistore</text>

  <text x="88" y="392" font-family="Inter, -apple-system, Segoe UI, system-ui, sans-serif"
        font-size="34" font-weight="700" letter-spacing="-1" fill="url(#lg)">Kafka's protocol.</text>
  <text x="88" y="438" font-family="Inter, -apple-system, Segoe UI, system-ui, sans-serif"
        font-size="34" font-weight="700" letter-spacing="-1" fill="url(#lg)">Object storage's economics.</text>

  <text x="88" y="500" font-family="JetBrains Mono, ui-monospace, Menlo, monospace"
        font-size="21" fill="#a3adc2">One Go binary. No ZooKeeper. No replication. Data lives in S3.</text>

  <!-- badge row -->
  <g transform="translate(88,540)">
    <rect x="0" y="0" width="196" height="44" rx="22" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="98" y="28" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="17" fill="#a3adc2">AGPL-3.0</text>

    <rect x="212" y="0" width="216" height="44" rx="22" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="320" y="28" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="17" fill="#a3adc2">kafka wire</text>

    <rect x="444" y="0" width="228" height="44" rx="22" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="558" y="28" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="17" fill="#a3adc2">single binary</text>
  </g>
</svg>
