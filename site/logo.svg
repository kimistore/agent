<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Kimistore">
  <title>Kimistore</title>
  <defs>
    <linearGradient id="ksBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ea8ff"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="ksSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".26"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="1" y="1" width="62" height="62" rx="16" fill="url(#ksBg)"/>
  <rect x="1" y="1" width="62" height="62" rx="16" fill="url(#ksSheen)"/>

  <!-- monogram: a radiating K, then an S. The K's arms fan out from a single
       vertex on the right, the gesture that reads as "dispatch". Scaled about
       the centre so the letterforms stay balanced inside the tile. -->
  <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
     transform="translate(32 32) scale(1.16) translate(-32 -32)">
    <path d="M16 19V45"/>
    <path d="M16 32 28 19"/>
    <path d="M16 32 28 45"/>
    <path d="M48 25.2C48 21.8 44.6 19 41 19S34 21.8 34 25.2s3.4 5.8 7 6.8 7 3.4 7 6.8-3.4 6.2-7 6.2-7-2.8-7-6.2"/>
  </g>
</svg>
